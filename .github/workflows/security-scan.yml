name: Security Scan

on:
  schedule:
    - cron: '0 0 * * 1' # Weekly on Monday
  workflow_dispatch: # For manual run
    
jobs:
  security:
    name: 'Security Scan'
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/mvt
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pip-audit bandit
          
      - name: Run pip-audit Security Check
        run: |
          pip-audit -r requirements.txt --desc --output-format=json --output=pip-audit-report.json
          pip-audit -r requirements.txt --desc
          
      - name: Run Bandit Security Scan
        run: |
          bandit -r . -f json -o bandit-report.json
          bandit -r . -f txt
          
      - name: Upload Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            src/mvt/pip-audit-report.json
            src/mvt/bandit-report.json
          retention-days: 30
